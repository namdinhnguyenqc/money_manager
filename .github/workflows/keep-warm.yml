name: Keep backend warm

# Render's free tier spins the service down after ~15 minutes of inactivity,
# causing a 30–60s cold start on the next request. This pings /health every
# ~10 minutes so the instance stays awake during the day.
#
# Override the target by setting a repository variable BACKEND_HEALTH_URL
# (Settings → Secrets and variables → Actions → Variables).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.BACKEND_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            URL="https://money-manager-xdem.onrender.com/health"
          fi
          echo "Pinging $URL"
          code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" --max-time 90 "$URL" || echo "000")
          echo "HTTP $code"
          head -c 300 /tmp/body.txt || true
          if [ "$code" != "200" ]; then
            echo "::warning::Health check returned $code"
          fi
