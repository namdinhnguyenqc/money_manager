name: TrọCare Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Lint Active Applications
        run: npm run lint

      - name: Type-check Active Applications
        run: npm run typecheck

      - name: Build Backend (Hono)
        run: npm --prefix backend run build

      - name: Run Unit Tests
        run: npm test

      - name: Build Frontend (Next.js)
        run: npm --prefix web-admin run build
