name: TrọCare Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Lint Active Applications
        run: npm run lint

      - name: Type-check Active Applications
        run: npm run typecheck

      - name: Build Backend (Hono)
        run: npm --prefix backend run build

      - name: Run Unit Tests
        run: npm test

      - name: Build Owner Web (web-admin/ — despite the name, this is the landlord app)
        run: npm --prefix web-admin run build

      # admin-portal/ is deliberately NOT an npm workspace: it keeps its own
      # package-lock.json and Vercel deploys it standalone. That also means the
      # `--workspaces` steps above skip it entirely, so it could break without
      # ever turning CI red. These two steps close that gap.
      - name: Install Admin Portal Dependencies
        run: npm --prefix admin-portal ci

      - name: Type-check Admin Portal
        run: npm --prefix admin-portal run typecheck

      - name: Build Admin Portal (admin-portal/ — the real admin app)
        run: npm --prefix admin-portal run build

  # Verifies the deployed sites, which the build job cannot: every failure this
  # repo has shipped (a dashboard that threw at render, a route selecting a
  # missing column, an admin project serving the owner app) compiled and
  # type-checked cleanly first.
  smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Deploys are triggered by this same push, so give them time to go live
      # before asserting against them.
      - name: Wait for deployments
        run: sleep 180

      - name: Smoke Test Deployed Sites
        run: node tools/smoke-test.mjs
